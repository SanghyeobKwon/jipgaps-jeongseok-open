name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'SanghyeobKwon/jipgaps-jeongseok-open'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out production mirror
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.0

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --scope=trader-kwon

      - name: Build and deploy on Vercel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --scope=trader-kwon)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production response
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel curl / --deployment "$DEPLOYMENT_URL" --scope=trader-kwon --silent --output response.html
          test -s response.html
